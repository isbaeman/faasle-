<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Faasle — Lyric Visualizer</title>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;height:100%;background:#000;color:#fff;font-family:'Great Vibes','Snell Roundhand','Apple Chancery',cursive;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
.line{position:absolute;width:min(92vw,900px);text-align:center;pointer-events:none}
.head{display:inline-flex;align-items:baseline;white-space:nowrap;max-width:100%}
.a{font-size:35px;color:#fff;position:relative;z-index:1}
.b{font-size:40px;color:#777;margin-left:-1.15em;position:relative;top:.5em;z-index:2;opacity:.92}
.rest{margin-top:.15em;font-size:35px;line-height:1.25;color:#fff}
.a,.b,.w{opacity:0;filter:blur(12px);transform:scale(.96);transition:opacity 1.2s ease,filter 1.2s ease,transform 1.4s ease}
.w{display:inline-block;margin:0 .12em}
.line.in .a{opacity:1;filter:blur(0);transform:scale(1)}
.line.in .b{opacity:.92;filter:blur(0);transform:scale(1);transition-delay:.55s}
.line.in .w{opacity:1;filter:blur(0);transform:scale(1)}
.line.out .music{opacity:0}
.line.out .a,.line.out .b,.line.out .w{opacity:0;filter:blur(8px);transform:scale(1.03);transition:opacity .7s ease,filter .7s ease,transform .7s ease;transition-delay:0s!important}
.line.final .b{opacity:0;filter:blur(6px);transition:opacity 3s ease 0s,filter 3s ease 0s}
.line.final .a,.line.final .w{opacity:0;filter:blur(6px);transform:scale(1.02);transition:opacity 3.2s ease 2.6s,filter 3.2s ease 2.6s,transform 3.2s ease 2.6s}
.music{position:relative;display:flex;align-items:center;justify-content:center;gap:.38em;color:#fff;font-size:46px;padding:.9em 1.6em;transition:opacity .7s ease}
.music::before{content:"";position:absolute;inset:-40% -30%;background:radial-gradient(ellipse at center,rgba(255,255,255,.09),rgba(255,255,255,0) 62%);z-index:-1;animation:glowPulse 4.5s ease-in-out infinite}
.music::after{content:"";position:absolute;left:50%;bottom:0;width:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:translateX(-50%);animation:lineGrow 2.4s ease .6s forwards}
.music .n{display:inline-block;width:auto;height:1.15em;fill:url(#ng);stroke:none;opacity:0;filter:blur(10px) drop-shadow(0 0 12px rgba(255,255,255,.6));transform:translateY(10px) scale(.9);animation:noteIn 1.8s cubic-bezier(.2,.7,.2,1) forwards,noteFloat 4.2s ease-in-out infinite}
.music .n:nth-child(1){animation-delay:.2s,2s;transform-origin:50% 100%}
.music .n:nth-child(2){height:1.55em;animation-delay:.8s,2.6s}
.music .n:nth-child(3){animation-delay:1.4s,3.2s;transform-origin:50% 100%}
.music .defs{position:absolute;width:0;height:0}
.music .sp{position:absolute;width:.34em;height:.34em;fill:#fff;opacity:0;filter:drop-shadow(0 0 6px #fff);animation:twinkle 3s ease-in-out infinite}
.music .sp:nth-last-of-type(3){left:18%;top:8%;animation-delay:1.8s}
.music .sp:nth-last-of-type(2){right:20%;top:2%;width:.26em;height:.26em;animation-delay:2.7s}
.music .sp:nth-last-of-type(1){left:46%;bottom:-2%;width:.22em;height:.22em;animation-delay:3.4s}
@keyframes noteFloat{0%,100%{translate:0 0;rotate:-2deg}50%{translate:0 -9px;rotate:2deg}}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4) rotate(0)}50%{opacity:.95;transform:scale(1) rotate(45deg)}}
.music .d{display:inline-block;font-family:inherit;opacity:.12;font-size:1.15em;text-shadow:0 0 14px rgba(255,255,255,.7);animation:dot 1.8s ease-in-out infinite}
.music .d:nth-child(4){animation-delay:0s}.music .d:nth-child(5){animation-delay:.25s}.music .d:nth-child(6){animation-delay:.5s}.music .d:nth-child(7){animation-delay:.75s}.music .d:nth-child(8){animation-delay:1s}
@keyframes noteIn{to{opacity:.97;filter:blur(0) drop-shadow(0 0 12px rgba(255,255,255,.6));transform:translateY(0) scale(1)}}
@keyframes dot{0%,100%{opacity:.12;transform:translateY(0) scale(.9)}50%{opacity:1;transform:translateY(-6px) scale(1.15)}}
@keyframes glowPulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes lineGrow{to{width:min(70vw,420px)}}
#pp{position:fixed;right:0;bottom:0;margin:0;padding:16px 24px calc(16px + env(safe-area-inset-bottom,0px));background:none;border:0;color:#fff;font:12px system-ui,sans-serif;letter-spacing:.18em;cursor:pointer;opacity:.45;transition:opacity .6s;z-index:5}
#pp:hover,#pp:focus-visible{opacity:1;outline:none}
@media(max-width:560px){.music{font-size:36px;gap:.3em}.rest{font-size:30px}.a{font-size:30px}.b{font-size:34px}}
</style>
</head>
<body>
<div id="stage"></div>
<button id="pp" type="button">PAUSE</button>
<script>
// Timeline: start / end in seconds, one lyric line each. Gaps (e.g. 1:15–2:00) are preserved.
const L=[
{s:0,e:26,music:true,text:""},
{s:26,e:28.7,text:"Beqaraar si thi raatein"},
{s:28.7,e:31.3,text:"beshumaar teri yaadein"},
{s:31.3,e:34,text:"Behisaab gham yeh tha mera"},
{s:34,e:37,text:"Beasar rahi sharaabein"},
{s:37,e:40,text:"besabar yeh dil jo mera"},
{s:40,e:43,text:"Bewaqoof tha tere bina"},
{s:43,e:46,text:"Beqaraar si thi raatein"},
{s:46,e:49,text:"beshumaar teri yaadein"},
{s:49,e:52,text:"Behisaab gham yeh tha mera"},
{s:52,e:54.7,text:"Beasar rahi sharaabein"},
{s:54.7,e:57.3,text:"besabar yeh dil jo mera"},
{s:57.3,e:60,text:"Bewaqoof tha tere bina"},
{s:62,e:64.3,text:"Tere bin"},
{s:64.3,e:66.7,text:"raat-din"},
{s:66.7,e:69,text:"Bheegta tha main ashkon ki baarish mein"},
{s:69,e:70.7,text:"Aaj tu hai saamne"},
{s:70.7,e:72.3,text:"jo Kam huye hain saare faasle"},
{s:72.3,e:74,text:"faasle"},
{s:120,e:122.5,text:"Aaj tod de chahe phir mujhe"},
{s:122.5,e:125,text:"Tujhse tootne mein bhi ek maza hai"},
{s:125,e:128,text:"Hum agar nahin baahon mein teri"},
{s:128,e:131,text:"Kiski phir bhala yeh haseen jagah hai?"},
{s:138,e:141.5,text:"Aaj tod de chahe phir mujhe"},
{s:141.5,e:145,text:"Tujhse tootne mein bhi ek maza hai"},
{s:145,e:148,text:"Hum agar nahin baahon mein teri"},
{s:148,e:151,text:"Kiski phir bhala yeh haseen jagah hai?"},
{s:157,e:159.5,text:"Bezubaan si thi raatein"},
{s:159.5,e:162,text:"barsi phir jo teri yaadein"},
{s:162,e:165,text:"Bikhra jinmein gham yeh tha mera"},
{s:165,e:167.5,text:"Betuki lagi sharaabein"},
{s:167.5,e:170,text:"bheega jinmein dil yeh mera"},
{s:170,e:174,text:"Bewajah tha sab tere bina"},
{s:174,e:178,text:"Aa gayi yeh shaam jo"},
{s:178,e:182,text:"Toh kal subah ka koi intezaar kyun kare?"},
{s:185,e:186.5,text:"Dooriyaan khatam huyi"},
{s:186.5,e:188,text:"Khatam huye hain saare faasle,"},
{s:188,e:190,text:"faasle"}
];
const OUTRO_AT=188,FINAL_AT=188,END_AT=194,FADE_OUT=0.6,LAST=L.length-1;
const stage=document.getElementById('stage'),btn=document.getElementById('pp');

const START_AT=0; // seconds on the timeline to begin from (0 = full 26s music intro)
let t=START_AT,last=performance.now(),playing=true,done=false,cur=-1,curEl=null;

function buildMusic(){
  const el=document.createElement('div');el.className='line';
  const m=document.createElement('div');m.className='music';
  m.innerHTML='<svg class="n" viewBox="0 0 40 56"><ellipse cx="12" cy="46" rx="9.2" ry="6.2" transform="rotate(-28 12 46)"/><path d="M19.8 44V5.5h1.9V44z"/><path d="M21.7 5.5C22.4 17.5 38 19 32.8 40c1.6-11.8-5.6-14.2-11.1-17.6z"/></svg><svg class="n" viewBox="0 0 64 56"><ellipse cx="12" cy="46" rx="9.2" ry="6.2" transform="rotate(-28 12 46)"/><ellipse cx="44" cy="40" rx="9.2" ry="6.2" transform="rotate(-28 44 40)"/><path d="M19.8 44V9h1.9v35zM51.8 38V3h1.9v35z"/><path d="M19.8 9.5L53.7 1.5V10.5L19.8 18.5z"/><path d="M19.8 21L53.7 13V16.5L19.8 24.5z" opacity=".9"/></svg><svg class="n" viewBox="0 0 40 56"><ellipse cx="12" cy="46" rx="9.2" ry="6.2" transform="rotate(-28 12 46)"/><path d="M19.8 44V5.5h1.9V44z"/><path d="M21.7 5.5C22.4 17.5 38 19 32.8 40c1.6-11.8-5.6-14.2-11.1-17.6z"/></svg><span class="d">.</span><span class="d">.</span><span class="d">.</span><span class="d">.</span><span class="d">.</span><svg class="defs" aria-hidden="true"><defs><linearGradient id="ng" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#b9b9b9"/></linearGradient></defs></svg><svg class="sp" viewBox="0 0 10 10"><path d="M5 0l1.1 3.9L10 5 6.1 6.1 5 10 3.9 6.1 0 5l3.9-1.1z"/></svg><svg class="sp" viewBox="0 0 10 10"><path d="M5 0l1.1 3.9L10 5 6.1 6.1 5 10 3.9 6.1 0 5l3.9-1.1z"/></svg><svg class="sp" viewBox="0 0 10 10"><path d="M5 0l1.1 3.9L10 5 6.1 6.1 5 10 3.9 6.1 0 5l3.9-1.1z"/></svg>';
  el.appendChild(m);stage.appendChild(el);return el;
}
function build(text){
  const w=text.split(/\s+/).filter(Boolean);
  const el=document.createElement('div');el.className='line';
  const head=document.createElement('div');head.className='head';
  const a=document.createElement('span');a.className='a';a.textContent=w.slice(0,2).join(' ');
  head.appendChild(a);
  if(w[2]){const b=document.createElement('span');b.className='b';b.textContent=w[2];head.appendChild(b)}
  el.appendChild(head);
  const rest=w.slice(3);
  if(rest.length){
    const r=document.createElement('div');r.className='rest';
    rest.forEach((x,i)=>{const s=document.createElement('span');s.className='w';s.textContent=x;s.style.transitionDelay=(0.9+i*0.09)+'s';r.appendChild(s)});
    el.appendChild(r);
  }
  stage.appendChild(el);void el.offsetWidth;
  requestAnimationFrame(()=>el.classList.add('in'));
  return el;
}
function drop(el){if(!el)return;el.classList.add('out');setTimeout(()=>el.remove(),900)}
function clearStage(){stage.innerHTML='';curEl=null;cur=-1}

function tick(now){
  const dt=Math.min((now-last)/1000,0.5);last=now;
  if(playing&&!done)t+=dt;

  if(!done){
    let i=L.findIndex(l=>t>=l.s&&t<l.e);
    if(i<0&&t>=OUTRO_AT)i=LAST;           // hold the final lyric through the outro
    if(i!==cur){
      if(curEl)drop(curEl);
      curEl=null;cur=i;
      if(i>=0)curEl=L[i].music?buildMusic():build(L[i].text);
    }
    if(curEl&&cur>=0){
      if(cur===LAST){
        if(t>=FINAL_AT)curEl.classList.add('final');
      }else if(t>=L[cur].e-FADE_OUT){curEl.classList.add('out')}
      else{curEl.classList.remove('out')}
    }
    if(t>=END_AT){
      done=true;
      if(curEl){drop(curEl);curEl=null}
      btn.textContent='REPLAY';
    }
  }
  requestAnimationFrame(tick);
}

btn.onclick=()=>{
  if(done){clearStage();t=START_AT;last=performance.now();done=false;playing=true;btn.textContent='PAUSE';return}
  playing=!playing;
  btn.textContent=playing?'PAUSE':'PLAY';
};

requestAnimationFrame(n=>{last=n;tick(n)});
</script>
</body>
</html>
